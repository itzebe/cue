name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Pipeline checks
        run: npm run verify
      - name: Reproduce the README's Taste Gap figures
        run: npm run reproduce
      - name: Reproduce the exhaustive null distribution
        run: npm run reproduce:benchmark
      - name: Benchmark — replay metrics and assert they match the committed artifact
        run: npm run benchmark
      - name: Benchmark — verification suite
        run: npm run benchmark:verify
      - name: Production build
        run: npm run build
